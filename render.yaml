services:
  - type: web
    name: zendout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/migrate.py && cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zendout-db
          property: connectionString
      - key: AUTO_CREATE_DB
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

databases:
  - name: zendout-db
    plan: free
