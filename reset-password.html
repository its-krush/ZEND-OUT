<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen'd Out | Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Poppins,sans-serif;background:linear-gradient(135deg,#9de8f6,#6060f4)}
    .card{width:min(380px,90vw);background:#fff;border-radius:30px;padding:32px;box-shadow:0 20px 50px #0002}.brand{font:2.2rem Righteous;color:#3f3db3;text-align:center}.flash{display:none;padding:10px;border-radius:10px;margin:14px 0;font-size:.8rem;text-align:center;background:#fee2e2;color:#be123c}.flash.show{display:block}.flash.success{background:#d1fae5;color:#047857}
    .password-wrap{position:relative}.password-wrap input{padding-right:58px}input{width:100%;padding:13px;margin:7px 0;border:1px solid #e0e6ed;border-radius:12px;font:inherit}.toggle{position:absolute;right:8px;top:15px;border:0;background:transparent;color:#6060f4;font-size:.72rem;font-weight:700;cursor:pointer}.submit{width:100%;padding:13px;border:0;border-radius:12px;background:#6060f4;color:white;font-weight:600;cursor:pointer;margin-top:12px}
  </style>
</head>
<body><main class="card"><div class="brand">Zen'd Out</div><div id="flash" class="flash"></div><div class="password-wrap"><input id="password" type="password" placeholder="New password"><button class="toggle" type="button" onclick="togglePassword('password',this)">Show</button></div><div class="password-wrap"><input id="confirm" type="password" placeholder="Confirm new password"><button class="toggle" type="button" onclick="togglePassword('confirm',this)">Show</button></div><button class="submit" type="button" onclick="resetPassword()">Reset Password</button></main>
<script src="api.js"></script><script>
  const token = new URLSearchParams(location.search).get('token');
  function togglePassword(id, button){const input=document.getElementById(id);input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'Show':'Hide';}
  function flash(message, success=false){const el=document.getElementById('flash');el.textContent=message;el.className='flash show'+(success?' success':'');}
  async function resetPassword(){const password=document.getElementById('password').value;const confirm=document.getElementById('confirm').value;if(!token){flash('This reset link is invalid or incomplete.');return;}if(password.length<12){flash('Password must be at least 12 characters.');return;}if(password!==confirm){flash('Passwords do not match.');return;}try{await ZenAPI.resetPassword(token,password);flash('Password reset. You can now log in.','success');setTimeout(()=>location.href='index.html',1200);}catch(error){flash(error.message==='invalid_or_expired_reset_token'?'This reset link is invalid or expired.':'Unable to reset password.');}}
</script></body></html>
